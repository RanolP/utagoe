[workspace]
members = [
    "apps/utagoe-app/src-tauri",
    "crates/libutagoe",
    "crates/saisei",
    "crates/wakatta",
    "crates/utagoe-acquisition",
    "crates/utagoe-provider-protocol",
    "crates/utagoe-provider-runtime",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/RanolP/utagoe"

[workspace.dependencies]
anyhow = "1"
bincode = { version = "2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }
